<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Offline | Core Java Mastery</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      align-items: center;
      background: #f8fafc;
      color: #172033;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    main {
      max-width: 420px;
    }

    img {
      border-radius: 24px;
      height: 88px;
      width: 88px;
    }

    h1 {
      margin: 20px 0 10px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    button {
      background: #2563eb;
      border: 0;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font: inherit;
      margin-top: 12px;
      padding: 12px 18px;
    }
  </style>
</head>

<body>
  <main><img src="./icons/icon-192.png" alt="Core Java Mastery">
    <h1>You’re offline</h1>
    <p>This page has not been saved on your device yet. Reconnect and visit it once to make it available offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>

</html>
